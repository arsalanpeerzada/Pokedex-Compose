name: CI

on:
  push:
    branches: [main, "day-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties, so Gradle doesn't download its own JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, unit test and lint
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace 2>&1 | tee build.log

      # Annotations show on the run page and in the API without signing in, unlike the raw log.
      - name: Summarise failures
        if: failure()
        run: |
          grep -E "^e: |FAILED|What went wrong|Could not|Execution failed|OutOfMemory|expected:" build.log | head -n 25 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -rhoE '<failure message="[^"]{0,300}' --include='TEST-*.xml' . | head -n 10 | sed 's/<failure message="/::error::Test failed: /' || true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7
